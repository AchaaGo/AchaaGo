name: Build driver app APK

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['apps/mobile/**']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate native Android project
        run: flutter create --platforms=android --org mn.achaago .

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (report only, does not block the build)
        run: flutter analyze || true

      - name: Run tests (report only, does not block the build)
        run: flutter test || true

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: achaago-driver-debug-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
