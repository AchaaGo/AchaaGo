name: Build driver app APK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: REST API address the app talks to
        default: http://64.119.31.106:8187/api
      ws_base_url:
        description: WebSocket address for live tracking
        default: ws://64.119.31.106:8187
  push:
    branches: [main, 'claude/mobile-**']
    paths: ['apps/mobile/**', '.github/workflows/mobile-apk.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    env:
      API_BASE_URL: ${{ inputs.api_base_url || 'http://64.119.31.106:8187/api' }}
      WS_BASE_URL: ${{ inputs.ws_base_url || 'ws://64.119.31.106:8187' }}
      GOOGLE_MAPS_API_KEY_ANDROID: ${{ secrets.GOOGLE_MAPS_API_KEY_ANDROID }}
      MOBILE_DEBUG_KEYSTORE_BASE64: ${{ secrets.MOBILE_DEBUG_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project
        run: ./tool/prepare_android.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug --dart-define=API_BASE_URL="$API_BASE_URL" --dart-define=WS_BASE_URL="$WS_BASE_URL"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: achaago-debug-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
