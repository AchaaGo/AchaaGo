name: achaago
services:
  gateway:
    image: nginx:1.28-alpine
    ports:
      - "${WEB_PORT:-8187}:8080"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web: {condition: service_started}
      api: {condition: service_healthy}
    restart: unless-stopped
    mem_limit: 128m
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
    environment:
      API_INTERNAL_URL: http://api:8000
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped
    mem_limit: 512m
  api:
    build: ./services/api
    env_file: .env
    environment: &api_environment
      DATABASE_URL: postgresql+asyncpg://achaago:${POSTGRES_PASSWORD}@postgres:5432/achaago
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --no-access-log"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 8
    restart: unless-stopped
    mem_limit: 768m
  worker:
    build: ./services/api
    env_file: .env
    environment: *api_environment
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
    mem_limit: 512m
  beat:
    build: ./services/api
    env_file: .env
    environment: *api_environment
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/achaago-beat"]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
    mem_limit: 256m
  postgres:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: achaago
      POSTGRES_DB: achaago
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U achaago -d achaago"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: 768m
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "192mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - ./.data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: 256m
