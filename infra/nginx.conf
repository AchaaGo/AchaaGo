map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
    listen 8080;
    server_tokens off;
    # Behind the HTTPS proxy (docker-compose.yml "caddy"), take the client address from the
    # header it sets, or every request would share the proxy's address and the per-IP OTP and
    # rate limits would lock everyone out together. Only that fixed address is trusted, so a
    # client reaching this port directly can't fake its address.
    set_real_ip_from 172.30.0.2;
    real_ip_header X-Forwarded-For;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        access_log off;
    }
    location /ws/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_read_timeout 70s;
        access_log off;
    }
    location / {
        proxy_pass http://web:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }
}
